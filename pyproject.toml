[dependency-groups]
dev = [
    "types-requests>=2.32,<3",
    "hatchling>=1.27,<2",
    "mypy>=1.18,<2",
    "pre-commit>=4.3,<5",
    "pre-commit-hooks>=6,<7",
    "pytest>=8.4,<10",
    "ruff>=0.14,<1",
    "uv>=0.13.8,<0.14",
]

[tool.uv]
required-version = ">=0.13.8,<0.14"

[tool.uv.workspace]
members = ["packages/core", "packages/mcp-server", "packages/agent"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "D"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.mypy]
python_version = "3.12"
strict = true
files = [
    "packages/core/src",
    "packages/mcp-server/src",
    "packages/agent/src",
]

[tool.pytest.ini_options]
testpaths = ["packages/core/tests", "packages/mcp-server/tests", "packages/agent/tests"]
addopts = "--import-mode=importlib"
