[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "athlete-ledger"
version = "0.0.1"
description = "Training and wellness ledger."
requires-python = ">=3.12"
license = "MIT"
dependencies = [
    "garmin-connect-personal-api-python>=1.0,<2",
    "SQLAlchemy>=2.0.44,<2.1",
    "alembic>=1.17,<2",
    "oracledb>=3.4,<5",
    "pydantic>=2.12,<3",
    "pydantic-settings>=2.11,<3",
]

[project.scripts]
athlete-ledger = "athlete_ledger.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/athlete_ledger"]
