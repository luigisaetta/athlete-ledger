[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "athlete-ledger-mcp"
version = "0.0.1"
description = "Read-only MCP interface for the training ledger."
requires-python = ">=3.12"
license = "MIT"
dependencies = ["athlete-ledger", "mcp>=2.3,<3"]

[project.scripts]
athlete-ledger-mcp = "athlete_ledger_mcp.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/athlete_ledger_mcp"]

[tool.uv.sources]
athlete-ledger = { workspace = true }
