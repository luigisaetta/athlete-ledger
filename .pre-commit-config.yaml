# Use tools from the active athlete-ledger Conda environment.
repos:
  - repo: local
    hooks:
      - id: ruff-check
        name: ruff lint
        entry: python -m ruff check --fix
        language: system
        types_or: [python, pyi]
      - id: ruff-format
        name: ruff format
        entry: python -m ruff format
        language: system
        types_or: [python, pyi]
      - id: end-of-file-fixer
        name: fix end of files
        entry: python -m pre_commit_hooks.end_of_file_fixer
        language: system
        types: [text]
      - id: trailing-whitespace
        name: trim trailing whitespace
        entry: python -m pre_commit_hooks.trailing_whitespace_fixer
        language: system
        types: [text]
      - id: check-yaml
        name: check yaml
        entry: python -m pre_commit_hooks.check_yaml
        language: system
        types: [yaml]
      - id: detect-private-key
        name: detect private key
        entry: python -m pre_commit_hooks.detect_private_key
        language: system
        types: [text]
